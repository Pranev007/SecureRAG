server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API through the same origin as the app. The browser therefore
    # never makes a cross-origin request, which removes CORS preflights and
    # means the frontend bundle needs no absolute backend URL baked into it.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Uploads are capped at 20 MB by the application; matching it here
        # rejects an oversized body at the edge instead of streaming it.
        client_max_body_size 25m;
    }

    location = /health { proxy_pass http://backend:8000/health; }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients on a stale bundle pointing at deleted asset filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
