name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · lint, tests, evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs on SQLite by default and skips the PostgreSQL tests when
    # no server is present. Providing one here means the pgvector and
    # full-text code paths -- the halves that actually run in production --
    # are exercised in CI too.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: securerag
          POSTGRES_PASSWORD: securerag
          POSTGRES_DB: securerag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securerag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # SQLite via the real Alembic migrations, plus the PostgreSQL suite
      # against the service above. A broken migration fails the build on both.
      - name: Tests
        run: pytest -q

      - name: Confirm the PostgreSQL tests actually ran
        # They skip silently without a server, so assert they were collected
        # and passed rather than trusting a green tick that skipped them.
        run: pytest tests/integration/test_postgres_backends.py -q --no-header -rN

      # Turns the evaluation suite into a regression gate: if a guardrail
      # regresses, the pass rate drops and the build fails.
      - name: Evaluation
        run: python -m app.evaluation.run --fail-under 0.90

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/reports/latest.md
          if-no-files-found: ignore

  # The main job installs requirements-dev.txt only, so the NLI tests skip
  # there -- deliberately, since torch is ~2 GB and most changes cannot affect
  # it. But a green tick that silently skipped a guardrail's tests is exactly
  # what the PostgreSQL step above exists to prevent, so the same rule applies:
  # run them somewhere, and assert they really ran.
  nli:
    name: Backend · NLI grounding (optional dependency)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-optional.txt

      # ~750 MB of weights. Cached on the model name so a checkpoint change
      # busts it rather than silently testing the old one.
      - name: Cache the NLI checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cross-encoder-nli-deberta-v3-base

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers sentencepiece

      - name: Warm the checkpoint
        run: |
          python -c "from sentence_transformers import CrossEncoder;             CrossEncoder('cross-encoder/nli-deberta-v3-base', max_length=384)"

      - name: NLI tests
        run: pytest -m requires_nli -q

      - name: Confirm they actually ran
        # `-m requires_nli` passes vacuously if every test skipped, which is
        # the failure this whole job exists to catch.
        run: |
          count=$(pytest -m requires_nli --collect-only -q 2>/dev/null                   | grep -oE ': [0-9]+$' | grep -oE '[0-9]+'                   | awk '{s+=$1} END {print s+0}')
          echo "collected $count NLI tests"
          test "$count" -gt 0
          pytest -m requires_nli -q -rs 2>&1 | tee /tmp/nli.txt
          if grep -q SKIPPED /tmp/nli.txt; then
            echo "::error::NLI tests skipped -- the checkpoint did not load"
            exit 1
          fi

  frontend:
    name: Frontend · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t securerag-backend ./backend
      - name: Build frontend image
        run: docker build -t securerag-frontend ./frontend
