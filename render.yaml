# Render blueprint for the SecureRAG backend and its database.
#
# The frontend is NOT here -- it is a static Vite build and belongs on Vercel
# (see docs/deployment.md). This file covers the half that needs a connection
# pool, a long-running process and a place to run migrations.
#
# The service is stateless apart from Postgres, so it needs no volume and can
# be moved to any host that runs a container.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.

services:
  - type: web
    name: securerag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/ready
    autoDeployTrigger: commit

    # No disk. Ingestion parses uploads in memory and stores chunks and
    # embeddings in Postgres -- the original bytes are never written to disk
    # and never read back, so the only durable state is the database.

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securerag-db
          property: connectionString

      # Generated once by Render and held thereafter. Tokens must survive a
      # restart, and a secret in this file would be a secret in git.
      - key: JWT_SECRET_KEY
        generateValue: true

      # NOT "production", and the distinction is enforced rather than
      # cosmetic: app.main refuses to boot when ENVIRONMENT=production while
      # LLM_PROVIDER=echo or EMBEDDING_PROVIDER=hashing, so that nobody serves
      # real users from the deterministic stand-ins. This blueprint runs on
      # exactly those stand-ins, so it is staging by definition. Move to
      # production only together with real provider credentials below.
      - key: ENVIRONMENT
        value: staging
      - key: LOG_FORMAT
        value: json

      # Set this to the Vercel URL once the frontend is deployed. It is the
      # only value that must be edited by hand, and the browser will refuse
      # every API call until it matches the real origin.
      - key: CORS_ORIGINS
        sync: false

      # Generation runs through a hosted OpenAI-compatible endpoint. One
      # provider class covers OpenAI, Groq, Together, OpenRouter, vLLM and
      # LM Studio, so switching vendor is a base URL and a model name.
      #
      # Groq is the default here because its free tier is enough for a public
      # demo and it is faster than local inference, not slower.
      #
      # WITHOUT A KEY THE CHAT RETURNS A CLEAN 502 ("The language model service
      # is currently unavailable") -- not a crash, and nothing internal leaks.
      # To run with no credentials at all, set LLM_PROVIDER=echo: a
      # deterministic extractive responder, not a language model. The security
      # layers behave identically either way -- measured across four provider
      # configurations in docs/evaluation.md -- so the Playground and Dashboard
      # are fully functional without a key.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # Check https://console.groq.com/docs/models before changing this --
      # Groq retires model names, and a stale one is a 404 on every request.
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      # Never in git. Set this in the Render dashboard; `sync: false` means the
      # blueprint neither carries the value nor overwrites what you set.
      - key: LLM_API_KEY
        sync: false
      # Embeddings stay offline deliberately. The vector column is sized from
      # EMBEDDING_DIMENSIONS at migration time, so changing the embedder means
      # a fresh database and re-uploading every document -- a much bigger move
      # than swapping the LLM, and /health/ready reports the mismatch if the
      # two ever disagree.
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: EMBEDDING_DIMENSIONS
        value: "384"

      # Lexical grounding only. nli/hybrid needs ~2 GB of torch plus a 750 MB
      # checkpoint, which does not fit the free plan.
      - key: GROUNDING_METHOD
        value: lexical

      # A public demo is a rate-limiting problem, not a capacity one.
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_UPLOAD_PER_MINUTE
        value: "5"

databases:
  - name: securerag-db
    plan: free
    postgresMajorVersion: "16"
